apiVersion: batch/v1
kind: CronJob
metadata:
  name: toxiproxy-reset-peer
  namespace: default
spec:
  # Every minute. reset_peer only fires once traffic flows through the toxic,
  # so it's added, given a second to hit any in-flight connection, then removed
  # again rather than left permanently enabled.
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reset-peer
              image: curlimages/curl:8.10.1
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  for proxy in rabbitmq-amqp rabbitmq-stream; do
                    curl -sf -X POST "http://toxiproxy:8474/proxies/${proxy}/toxics" \
                      -H 'Content-Type: application/json' \
                      -d '{"name":"periodic_reset_peer","type":"reset_peer","stream":"downstream","attributes":{"timeout":0}}'
                  done
                  sleep 1
                  for proxy in rabbitmq-amqp rabbitmq-stream; do
                    curl -sf -X DELETE "http://toxiproxy:8474/proxies/${proxy}/toxics/periodic_reset_peer"
                  done
